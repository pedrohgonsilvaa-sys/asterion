[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "asterion"
version = "0.1.0"
description = "Fundação técnica do ASTERION — RPG/MMORPG dark fantasy para Telegram."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiogram>=3,<4",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "SQLAlchemy[asyncio]>=2,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "redis>=5,<7",
  "APScheduler>=3.10,<4",
  "pydantic-settings>=2,<3",
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
asterion-api = "asterion.main:main"
asterion-bot = "asterion.bot.polling:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"asterion.bot" = ["creation_copy.json"]
"asterion.domain" = ["narrative_choices_catalog.json", "narrative_reactions_catalog.json", "narrative_choices_prologue_catalog.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
