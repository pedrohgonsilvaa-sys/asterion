name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Ruff
        run: python -m pip install "ruff>=0.8,<1"
      - name: Lint
        run: ruff check .

  test-shard:
    name: Test (${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: asterion_test
          POSTGRES_USER: asterion
          POSTGRES_PASSWORD: asterion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asterion -d asterion_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ASTERION_TEST_DATABASE_URL: postgresql+asyncpg://asterion:asterion@localhost:5432/asterion_test
      ASTERION_DATABASE_URL: postgresql+asyncpg://asterion:asterion@localhost:5432/asterion_test
      ASTERION_TEST_SHARD: ${{ matrix.shard }}
      ASTERION_TEST_SHARDS: ${{ matrix.total }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Alembic check
        if: matrix.shard == 1
        run: |
          alembic upgrade head
          alembic check

  test:
    name: Test
    if: always()
    needs: test-shard
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate test shards
        run: |
          if [ "${{ needs.test-shard.result }}" != "success" ]; then
            echo "One or more test shards failed."
            exit 1
          fi
          echo "All test shards passed."
