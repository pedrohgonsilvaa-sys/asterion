name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: asterion_test
          POSTGRES_USER: asterion
          POSTGRES_PASSWORD: asterion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asterion -d asterion_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ASTERION_TEST_DATABASE_URL: postgresql+asyncpg://asterion:asterion@localhost:5432/asterion_test
      ASTERION_DATABASE_URL: postgresql+asyncpg://asterion:asterion@localhost:5432/asterion_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Point backup tests at the Postgres service container
        # pg_dump must match the server (16); the runner's newer client emits SQL it rejects.
        run: echo "ASTERION_TEST_PG_CONTAINER=$(docker ps -q --filter ancestor=postgres:16-alpine | head -n1)" >> "$GITHUB_ENV"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Alembic check
        run: |
          alembic upgrade head
          alembic check
