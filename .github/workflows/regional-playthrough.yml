name: Regional Playthroughs

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/regional-playthrough.yml"
      - "src/asterion/application/**"
      - "src/asterion/domain/**"
      - "src/asterion/bot/**"
      - "tests/test_tdo_full_playthrough.py"
      - "tests/test_vde_full_playthrough.py"
      - "tests/helpers/tdo_playthrough.py"

jobs:
  regional-playthrough:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: asterion_test
          POSTGRES_USER: asterion
          POSTGRES_PASSWORD: asterion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asterion -d asterion_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ASTERION_TEST_DATABASE_URL: postgresql+asyncpg://asterion:asterion@localhost:5432/asterion_test
      ASTERION_DATABASE_URL: postgresql+asyncpg://asterion:asterion@localhost:5432/asterion_test
      ASTERION_RUN_TDO_FULL_PLAYTHROUGH: "1"
      ASTERION_RUN_VDE_FULL_PLAYTHROUGH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run fresh TDO and Vales playthroughs
        run: pytest -q tests/test_tdo_full_playthrough.py tests/test_vde_full_playthrough.py
