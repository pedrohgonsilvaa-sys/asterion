# Deploy automático na VPS após cada push na branch principal.
# O ambiente de produção continua protegendo os secrets e o backup obrigatório.
name: deploy-vps

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - name: Preparar chave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Criar e conferir backup antes do deploy
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd ${{ secrets.VPS_PATH }} && mkdir -p backups && stamp=\$(date -u +%Y%m%d%H%M%S) && dump=backups/pre-deploy-\${stamp}.dump && docker compose --env-file .env.prod -f docker-compose.prod.yml exec -T postgres pg_dump -U asterion -d asterion -Fc > \"\${dump}\" && test -s \"\${dump}\" || { echo 'Falha ao criar backup .dump. Pare.'; exit 1; }"

      - name: Atualizar código e subir containers
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd ${{ secrets.VPS_PATH }} && git pull origin main && docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build"

      - name: Conferir logs do bot
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd ${{ secrets.VPS_PATH }} && docker compose --env-file .env.prod -f docker-compose.prod.yml logs --tail 100 bot"
