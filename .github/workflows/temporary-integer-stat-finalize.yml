name: Temporary integer stat finalization

on:
  push:
    branches: [fix/integer-final-primary-stats]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: asterion_test
          POSTGRES_USER: asterion
          POSTGRES_PASSWORD: asterion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asterion -d asterion_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ASTERION_TEST_DATABASE_URL: postgresql+asyncpg://asterion:asterion@localhost:5432/asterion_test
      ASTERION_DATABASE_URL: postgresql+asyncpg://asterion:asterion@localhost:5432/asterion_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/integer-final-primary-stats
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Apply final contract updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/test_equipment_integration.py')
          text = p.read_text(encoding='utf-8')
          if text.count('Decimal(407)') != 2 or text.count('Decimal(356)') < 1:
              raise SystemExit('unexpected equipment HP assertions')
          text = text.replace('Decimal(407)', 'Decimal(406)', 2)
          text = text.replace('assert character.hp == Decimal(356)', 'assert character.hp == Decimal(355)', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('src/asterion/domain/combat_math.py')
          text = p.read_text(encoding='utf-8')
          old = '''LEGACY_COMBAT_RULESET = "gdd-1.4.3-baseline-1.0"\nCURRENT_COMBAT_RULESET = "gdd-1.4.6-baseline-1.0"\nSUPPORTED_LEGACY_COMBAT_RULESETS = frozenset({LEGACY_COMBAT_RULESET, "gdd-1.4.2-baseline-1.0"})'''
          new = '''LEGACY_COMBAT_RULESET = "gdd-1.4.3-baseline-1.0"\nCURRENT_COMBAT_RULESET = "gdd-1.4.9-baseline-1.0"\nSUPPORTED_LEGACY_COMBAT_RULESETS = frozenset(\n    {\n        LEGACY_COMBAT_RULESET,\n        "gdd-1.4.2-baseline-1.0",\n        "gdd-1.4.6-baseline-1.0",\n    }\n)'''
          if old not in text:
              raise SystemExit('combat ruleset constants changed unexpectedly')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate focused contract
        run: |
          pytest -q tests/test_equipment_integration.py::test_equipment_hp_changes_preserve_percentage_and_never_revive
          pytest -q tests/test_combat_math.py
          pytest -q -k 'ruleset or prologue'
          ruff check .
          git diff --check
      - name: Commit final updates
        shell: bash
        run: |
          rm .github/workflows/temporary-integer-stat-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests .github/workflows/temporary-integer-stat-finalize.yml
          git commit -m "fix: version integer primary stat ruleset"
          git push origin HEAD:fix/integer-final-primary-stats
